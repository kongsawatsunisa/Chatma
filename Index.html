<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;700&display=swap">
<style>
  :root { --ink:#14161f; --muted:#5a6072; --violet:#5b3df5; --lav:#eeeafe; --sun:#ffcf33; --line:#e1def5; }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; scroll-padding-top:64px; }
  body { margin:0; color:var(--ink); font:17px/1.65 Prompt,"Noto Sans Thai",system-ui,sans-serif; }
  a { color:inherit; }
  :focus-visible { outline:3px solid var(--sun); outline-offset:3px; }

  header { position:fixed; inset:0 0 auto 0; height:64px; z-index:10; display:flex; align-items:center; justify-content:space-between;
           padding:0 clamp(16px,4vw,48px); background:rgba(91,61,245,.96); color:#fff; }
  .logo { font-weight:700; font-size:1.25rem; text-decoration:none; }
  nav { display:flex; gap:clamp(12px,3vw,32px); align-items:center; }
  nav a { text-decoration:none; font-size:.95rem; }
  nav a:hover { text-decoration:underline; }
  .lang { background:none; border:1px solid rgba(255,255,255,.6); color:#fff; border-radius:999px; padding:2px 12px; font:inherit; font-size:.85rem; cursor:pointer; }
  @media (max-width:640px){ nav a.hide-sm { display:none; } }

  .hero { min-height:100dvh; background:var(--violet); color:#fff; display:grid; grid-template-columns:1.1fr .9fr; align-items:center;
          gap:32px; padding:96px clamp(16px,6vw,96px) 48px; }
  .hero h1 { font-size:clamp(2.4rem,6.5vw,5rem); line-height:1.1; margin:0 0 20px; font-weight:700; }
  .hero p { font-size:1.15rem; max-width:34ch; margin:0 0 28px; opacity:.92; }
  .stores { display:flex; gap:12px; flex-wrap:wrap; }
  .btn { display:inline-block; padding:12px 24px; border-radius:999px; background:var(--sun); color:var(--ink); font-weight:500; text-decoration:none; border:0; font:inherit; font-weight:500; cursor:pointer; }
  .btn.alt { background:transparent; color:#fff; border:2px solid #fff; }
  .phone { justify-self:center; width:min(280px,70vw); aspect-ratio:9/18; background:#fff; border-radius:36px; border:8px solid var(--ink);
           padding:28px 14px; display:flex; flex-direction:column; gap:10px; }
  .bub { max-width:78%; padding:9px 13px; border-radius:16px; font-size:.85rem; line-height:1.4; color:var(--ink); background:var(--lav); }
  .bub.me { align-self:flex-end; background:var(--sun); }
  @media (max-width:820px){ .hero { grid-template-columns:1fr; } .phone { display:none; } }

  section.block { padding:clamp(56px,10vw,120px) clamp(16px,6vw,96px); }
  .inner { max-width:880px; margin:0 auto; }
  h2 { font-size:clamp(1.7rem,4vw,2.6rem); line-height:1.2; margin:0 0 16px; }
  .lead { color:var(--muted); max-width:56ch; }
  #about { background:var(--lav); }
  .services { list-style:none; padding:0; margin:32px 0 0; border-top:1px solid var(--line); }
  .services li { display:grid; grid-template-columns:minmax(120px,220px) 1fr; gap:16px; padding:18px 0; border-bottom:1px solid var(--line); }
  .services b { font-weight:700; }
  .services span { color:var(--muted); }

  form { display:grid; gap:12px; max-width:520px; margin-top:24px; }
  input, textarea { font:inherit; padding:10px 12px; border:1px solid #b9b3e6; border-radius:8px; width:100%; }
  #msg { min-height:1.5em; color:var(--violet); }
  footer { padding:28px; text-align:center; color:var(--muted); font-size:.9rem; border-top:1px solid var(--line); }
  dialog { border:0; border-radius:12px; padding:24px; width:min(380px,92vw); }
  dialog::backdrop { background:rgba(20,22,31,.55); }
  dialog h3 { margin:0 0 12px; font-size:1.4rem; }
  #af { margin:0; max-width:none; }
  #aerr { color:#c0262d; min-height:1.4em; font-size:.9rem; }
  .link { background:none; border:0; color:var(--violet); font:inherit; cursor:pointer; text-decoration:underline; padding:0; }
  header[hidden] { display:none; }
  #app { position:fixed; inset:0; max-width:480px; margin:0 auto; background:#fff; display:flex; flex-direction:column; box-shadow:0 0 0 1px var(--line); z-index:20; font-size:16px; }
  #app[hidden], .screen[hidden], .menu[hidden] { display:none; }
  #app svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .screen { flex:1; overflow-y:auto; padding:0 20px 20px; }
  .bar, .top { display:flex; align-items:center; padding:16px 0 10px; }
  .bar { justify-content:flex-end; gap:20px; }
  .top { justify-content:space-between; }
  .ib { background:none; border:0; padding:2px; color:var(--ink); cursor:pointer; position:relative; display:flex; }
  .ib svg { width:26px; height:26px; }
  .dot { position:absolute; top:0; right:-2px; width:9px; height:9px; border-radius:50%; background:#ff4d4f; }
  .menu { position:absolute; top:56px; right:16px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:6px; z-index:5; box-shadow:0 6px 20px rgba(0,0,0,.12); }
  .menu button { background:none; border:0; font:inherit; padding:8px 14px; cursor:pointer; }
  .profile { display:flex; justify-content:space-between; align-items:center; margin:8px 0 20px; }
  .profile h1 { margin:0; font-size:1.7rem; line-height:1.2; }
  .profile p { margin:0; color:#8a8fa3; }
  .ava { width:52px; height:52px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:700; font-size:1.2rem; flex:none; }
  .ava.big { width:64px; height:64px; font-size:1.5rem; }
  .add-ava { width:64px; height:64px; border-radius:50%; border:2px dashed #c9c5ea; display:grid; place-items:center; color:#8a8fa3; font-size:1.6rem; margin-right:-14px; }
  .search { display:flex; align-items:center; gap:10px; background:#f1f2f6; border-radius:999px; padding:10px 16px; color:#8a8fa3; margin-bottom:16px; }
  .search span { flex:1; }
  .search svg { width:22px; height:22px; }
  .sec { display:flex; justify-content:space-between; align-items:baseline; margin:14px 0 6px; }
  .sec b { font-size:1.05rem; } .sec a { color:#8a8fa3; font-size:.9rem; cursor:pointer; }
  .fr, .chat { display:grid; grid-template-columns:56px 1fr auto; gap:14px; align-items:center; padding:10px 0; }
  .chat { cursor:pointer; padding:12px 0; }
  .t, .n { font-weight:500; display:flex; gap:6px; align-items:center; }
  .s { color:#8a8fa3; font-size:.9rem; }
  .trunc { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .collage { width:52px; height:52px; border-radius:50%; overflow:hidden; display:grid; grid-template-columns:1fr 1fr; }
  .cnt { display:flex; align-items:center; gap:2px; color:#8a8fa3; }
  .n svg, .meta svg { width:16px; height:16px; color:#8a8fa3; }
  .tip { background:var(--violet); color:#fff; border-radius:10px; padding:8px 8px 8px 14px; display:flex; justify-content:space-between; align-items:center; margin:8px 0; font-size:.95rem; }
  .svc { display:flex; gap:16px; overflow-x:auto; padding:10px 0 6px; }
  .svc div { flex:none; width:68px; text-align:center; font-size:.8rem; }
  .svc i { display:grid; place-items:center; width:52px; height:52px; border-radius:50%; background:var(--lav); font-size:1.5rem; font-style:normal; margin:0 auto 4px; }
  .promo { display:grid; grid-template-columns:1fr 1fr; border-radius:10px; overflow:hidden; margin:16px 0; border:1px solid var(--line); min-height:150px; }
  .promo .l { padding:16px; display:flex; align-items:flex-end; font-weight:700; color:var(--violet); font-size:1.15rem; }
  .promo .r { background:#9a86f2; }
  .pill { background:var(--ink); color:#fff; border:0; border-radius:999px; padding:8px 18px; font:inherit; font-weight:700; }
  .ad { display:grid; grid-template-columns:1fr 96px; gap:12px; align-items:center; padding:8px 0 14px; border-bottom:1px solid var(--line); }
  .ad b { line-height:1.3; display:block; } .ad p { margin:6px 0 0; color:#8a8fa3; font-size:.9rem; }
  .adimg { height:64px; border-radius:6px; background:#c9bdfb; }
  .meta { display:flex; flex-direction:column; align-items:flex-end; gap:6px; font-size:.8rem; color:#8a8fa3; }
  .badge { background:var(--violet); color:#fff; border-radius:999px; min-width:24px; padding:1px 8px; text-align:center; font-weight:700; }
  .soon { text-align:center; color:#8a8fa3; margin-top:40vh; }
  #tabs { display:grid; grid-template-columns:repeat(5,1fr); border-top:1px solid var(--line); padding:6px 0 max(8px,env(safe-area-inset-bottom)); background:#fff; }
  .tab { background:none; border:0; display:flex; flex-direction:column; align-items:center; gap:2px; font:inherit; font-size:.72rem; color:#8a8fa3; position:relative; cursor:pointer; }
  .tab.on { color:var(--ink); font-weight:700; } .tab.on svg { stroke-width:2.6; }
  .tab .dot { top:0; right:30%; } .tab .nb { position:absolute; top:-4px; left:52%; background:#ff4d4f; color:#fff; border-radius:999px; padding:0 6px; font-size:.7rem; }
  #app { --violet:#2bb673; }
  .promo .l { color:#5b3df5; }
  .ad { position:relative; }
  .adx { position:absolute; top:6px; right:0; color:#8a8fa3; }
  .adx svg { width:20px; height:20px; }
  .bubble { position:absolute; right:12px; bottom:84px; left:96px; background:#2bb673; color:#fff; border-radius:14px; padding:12px 14px; z-index:6; font-size:.95rem; }
  .bubble u { cursor:pointer; } .bubble button { background:none; border:0; color:#fff; font:inherit; margin-left:10px; cursor:pointer; }
</style>
</head>
<body>
<header id="top">
  <a class="logo" href="#home" style="display:flex;align-items:center;gap:10px"><svg width="32" height="32" viewBox="0 0 1024 1024" aria-hidden="true"><rect width="1024" height="1024" rx="230" fill="#fff"/><rect x="200" y="230" width="624" height="460" rx="150" fill="#5b3df5"/><path d="M330 640v190l190-170z" fill="#5b3df5"/><g fill="#ffcf33"><circle cx="340" cy="460" r="48"/><circle cx="512" cy="460" r="48"/><circle cx="684" cy="460" r="48"/></g></svg>แอปของฉัน</a>
  <nav>
    <a class="hide-sm" href="#about" data-i="n1"></a>
    <a class="hide-sm" href="#services" data-i="n2"></a>
    <a href="#contact" data-i="n3"></a>
    <button class="lang" id="loginBtn" data-i="login"></button>
    <button class="lang" id="logoutBtn" data-i="logout" hidden></button>
    <button class="lang" id="lang" aria-label="เปลี่ยนภาษา / Change language">EN</button>
  </nav>
</header>

<main id="site">
  <section class="hero" id="home">
    <div>
      <h1 data-i="h1"></h1>
      <p data-i="h1p"></p>
      <div class="stores">
        <a class="btn" href="#" data-i="ios"></a>
        <a class="btn alt" href="#" data-i="and"></a>
      </div>
    </div>
    <div class="phone" aria-hidden="true">
      <div class="bub" data-i="c1"></div>
      <div class="bub me" data-i="c2"></div>
      <div class="bub" data-i="c3"></div>
      <div class="bub me" data-i="c4"></div>
    </div>
  </section>

  <section class="block" id="about">
    <div class="inner">
      <h2 data-i="a1"></h2>
      <p class="lead" data-i="a2"></p>
    </div>
  </section>

  <section class="block" id="services">
    <div class="inner">
      <h2 data-i="s0"></h2>
      <ul class="services">
        <li><b data-i="s1"></b><span data-i="s1d"></span></li>
        <li><b data-i="s2"></b><span data-i="s2d"></span></li>
        <li><b data-i="s3"></b><span data-i="s3d"></span></li>
        <li><b data-i="s4"></b><span data-i="s4d"></span></li>
      </ul>
    </div>
  </section>

  <section class="block" id="contact" style="background:var(--lav)">
    <div class="inner">
      <h2 data-i="f0"></h2>
      <form id="form">
        <input id="fn" required data-ph="fn">
        <input id="fe" type="email" required data-ph="fe">
        <textarea id="fm" rows="4" required data-ph="fm"></textarea>
        <button class="btn" style="background:var(--violet);color:#fff" data-i="send"></button>
        <div id="msg" role="status"></div>
      </form>
    </div>
  </section>
</main>
<section id="app" hidden>
  <div class="screen" id="s-home"></div>
  <div class="screen" id="s-chat" hidden></div>
  <div class="screen" id="s-soon" hidden><p class="soon" id="soon"></p></div>
  <div id="tabs"></div>
</section>
<dialog id="dlg">
  <form id="af" method="dialog">
    <h3 id="at"></h3>
    <input id="an" data-ph="fn" autocomplete="name">
    <input id="ae" type="email" required data-ph="fe" autocomplete="email">
    <input id="ap" type="password" required minlength="8" data-ph="pw" autocomplete="current-password">
    <div id="aerr" role="alert"></div>
    <button class="btn" id="asub" style="background:var(--violet);color:#fff"></button>
    <p><button type="button" class="link" id="swt"></button> · <button type="button" class="link" id="cls" data-i="close"></button></p>
  </form>
</dialog>
<footer>© แอปของฉัน</footer>

<script>
const T = {
 th:{n1:'เกี่ยวกับ',n2:'บริการ',n3:'ติดต่อ',h1:'เคียงข้างคุณเสมอ',h1p:'แอปที่ช่วยให้ชีวิตประจำวันของคุณง่ายขึ้น ใช้ได้ทุกที่ ทุกเวลา',
  ios:'ดาวน์โหลดสำหรับ iOS',and:'ดาวน์โหลดสำหรับ Android',c1:'วันนี้ว่างไหม?',c2:'ว่างครับ เจอกันตอนบ่าย',c3:'โอเค ส่งพิกัดให้นะ',c4:'ได้เลย 👍',
  a1:'เกี่ยวกับแอป',a2:'เขียนคำอธิบายแอปของคุณตรงนี้ เช่น แอปนี้ทำอะไร ช่วยใครได้บ้าง และทำไมถึงแตกต่างจากแอปอื่น',
  s0:'บริการของเรา',s1:'บริการที่ 1',s1d:'อธิบายสั้นๆ ว่าบริการนี้ทำอะไร',s2:'บริการที่ 2',s2d:'อธิบายสั้นๆ ว่าบริการนี้ทำอะไร',
  s3:'บริการที่ 3',s3d:'อธิบายสั้นๆ ว่าบริการนี้ทำอะไร',s4:'บริการที่ 4',s4d:'อธิบายสั้นๆ ว่าบริการนี้ทำอะไร',
  f0:'ติดต่อเรา',fn:'ชื่อ',fe:'อีเมล',fm:'ข้อความ',send:'ส่งข้อความ',login:'เข้าสู่ระบบ',reg:'สมัครสมาชิก',logout:'ออกจากระบบ',pw:'รหัสผ่าน (อย่างน้อย 8 ตัว)',hi:'สวัสดี',dashp:'นี่คือพื้นที่สำหรับสมาชิก ใส่ข้อมูลหรือฟีเจอร์ของคุณตรงนี้',swReg:'ยังไม่มีบัญชี? สมัครสมาชิก',swLogin:'มีบัญชีแล้ว? เข้าสู่ระบบ',close:'ปิด',ok:'ส่งแล้ว ขอบคุณครับ',err:'ส่งไม่สำเร็จ ลองใหม่อีกครั้ง'},
 en:{n1:'About',n2:'Services',n3:'Contact',h1:'Always by your side',h1p:'An app that makes everyday life easier, anywhere, anytime.',
  ios:'Download for iOS',and:'Download for Android',c1:'Free today?',c2:'Yes, see you this afternoon',c3:'OK, sending the location',c4:'Sure 👍',
  a1:'About the app',a2:'Describe your app here: what it does, who it helps, and why it is different.',
  s0:'Our services',s1:'Service 1',s1d:'A short description of this service',s2:'Service 2',s2d:'A short description of this service',
  s3:'Service 3',s3d:'A short description of this service',s4:'Service 4',s4d:'A short description of this service',
  f0:'Contact us',fn:'Name',fe:'Email',fm:'Message',send:'Send',login:'Log in',reg:'Sign up',logout:'Log out',pw:'Password (min. 8 characters)',hi:'Hello,',dashp:'This is the members area. Put your own data and features here.',swReg:'No account? Sign up',swLogin:'Have an account? Log in',close:'Close',ok:'Sent. Thank you!',err:'Could not send. Please try again.'}
};
let lang = 'th';
function apply(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i]').forEach(el => el.textContent = T[lang][el.dataset.i]);
  document.querySelectorAll('[data-ph]').forEach(el => el.placeholder = T[lang][el.dataset.ph]);
  document.getElementById('lang').textContent = lang === 'th' ? 'EN' : 'TH';
}
document.getElementById('lang').onclick = () => { lang = lang === 'th' ? 'en' : 'th'; apply(); };
document.getElementById('form').onsubmit = ev => {
  ev.preventDefault();
  const m = document.getElementById('msg');
  google.script.run
    .withSuccessHandler(() => { m.textContent = T[lang].ok; ev.target.reset(); })
    .withFailureHandler(() => { m.textContent = T[lang].err; })
    .saveContact(fn.value, fe.value, fm.value);
};

// ---------- login ----------
const $ = id => document.getElementById(id);
const store = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}, del:k=>{try{localStorage.removeItem(k)}catch(e){}} };
const call = (fn, ...a) => new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...a));
let mode = 'login', token = store.get('tk');

function setMode(m){
  mode = m; $('an').hidden = m === 'login'; $('an').required = m === 'reg';
  $('ap').autocomplete = m === 'login' ? 'current-password' : 'new-password';
  $('at').dataset.i = m; $('asub').dataset.i = m; $('swt').dataset.i = m === 'login' ? 'swReg' : 'swLogin';
  $('aerr').textContent = ''; apply();
}

// ---------- app screens (ข้อมูลตัวอย่าง: ภายหลังดึงจาก Sheet ผ่าน google.script.run ได้) ----------
const I = {
 bookmark:'<path d="M6 3h12v18l-6-4-6 4z"/>', bell:'<path d="M18 16v-5a6 6 0 10-12 0v5l-2 2h16z"/><path d="M10 21h4"/>',
 userplus:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M19 8v6M16 11h6"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>', scan:'<path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/>',
 image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/>',
 calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>', plus:'<path d="M12 5v14M5 12h14"/>',
 chev:'<path d="M9 6l6 6-6 6"/>', mute:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l4 6M21 9l-4 6"/>', pin:'<path d="M12 17v5M8 3h8l-1 7 3 3H6l3-3z"/>',
 home:'<path d="M3 11l9-8 9 8v10H3z"/>', chat:'<path d="M21 12a8 8 0 01-11.5 7.2L4 20l1.2-4.6A8 8 0 1121 12z"/>',
 open:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/>', today:'<path d="M12 3a9 9 0 109 9"/><path d="M12 8v4l3 2"/>',
 wallet:'<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>'
};
const ic = k => '<svg viewBox="0 0 24 24" aria-hidden="true">' + I[k] + '</svg>';
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PAL = ['#7c5cff','#ff8a65','#26a69a','#ec6fa8','#5c9ded','#f2b134'];
const col = t => PAL[[...t].reduce((a, c) => a + c.charCodeAt(0), 0) % PAL.length];
const ava = t => '<div class="ava" style="background:' + col(t) + '">' + esc([...t][0] || '?') + '</div>';
const collage = cs => '<div class="collage">' + cs.map(c => '<i style="background:' + c + '"></i>').join('') + '</div>';

const GROUPS = [
 { t:'วันเกิดวันนี้', s:'สมชาย ใจดี, สมหญิง รักเรียน', n:2, c:['#ffb4a2','#b5d8ff','#ffe29a','#c8e6c9'] },
 { t:'เพื่อน', s:'อรทัย, วิชัย, มานี, ปิติ…', n:647, c:['#d1c4ff','#ffccbc','#b2dfdb','#f8bbd0'] },
 { t:'กลุ่ม', s:'ทีมสร้างแอป (9), ครอบครัว…', n:30, c:['#8d6e63','#ffcc80','#fff59d','#90caf9'] }
];
const SERVICES = [['พรีเมียม','⭐'],['สติกเกอร์','😊'],['ช้อปปิ้ง','🛍️'],['เพลง','🎵'],['ของขวัญ','🎁'],['บัญชีทางการ','🛡️']];
const CHATS = [
 { n:'แจ้งชำระค่างวด', m:'งวด 3/12 ยอดที่ต้องชำระ 2,570 บาท', t:'5/11', u:0, pin:1 },
 { n:'ทีมสร้างแอป (9)', m:'https://script.google.com/macros/s/…', t:'14:01', u:1 },
 { n:'กลุ่มลูกค้า VIP (18)', m:'รับทราบค่ะ ประสานงานติดตามให้ค่ะ', t:'13:22', u:158, mute:1 },
 { n:'ข่าวสารเครือข่าย', m:'ชวนสัมผัสความสุขได้ทุกวัน สำหรับลูกค้า…', t:'12:00', u:23, mute:1 },
 { n:'ระบบ', m:'เข้าสู่ระบบแล้ว', t:'11:39', u:1 },
 { n:'ธนาคาร', m:'บัญชีหลัก(xxx-x-x1234) ฝาก/รับเงิน 5,000.00 บาท', t:'09:10', u:10 }
];
const TABS = [['home','หน้าหลัก'],['chat','แชท'],['open','โอเพนแชท'],['today','TODAY'],['wallet','Wallet']];

function renderHome(u){
  $('s-home').innerHTML =
   '<div class="bar"><button class="ib" aria-label="บุ๊กมาร์ก">' + ic('bookmark') + '</button>' +
   '<button class="ib" aria-label="แจ้งเตือน">' + ic('bell') + '<i class="dot" style="background:#2bb673"></i></button>' +
   '<button class="ib" aria-label="เพิ่มเพื่อน">' + ic('userplus') + '</button>' +
   '<button class="ib" id="gear" aria-label="ตั้งค่า">' + ic('gear') + '</button></div>' +
   '<div class="menu" id="menu" hidden><button id="lo">ออกจากระบบ</button></div>' +
   '<div class="profile"><div><h1>' + esc(u.name) + '</h1><p>' + esc(u.email) + '</p></div>' +
   '<div style="display:flex"><div class="add-ava">+</div><div class="ava big" style="background:' + col(u.name) + '">' + esc([...u.name][0] || '?') + '</div></div></div>' +
   '<div class="search">' + ic('search') + '<span>ค้นหา</span>' + ic('scan') + '</div>' +
   '<div class="sec"><b>รายชื่อเพื่อน</b><a>ดูทั้งหมด</a></div>' +
   GROUPS.map(g => '<div class="fr">' + collage(g.c) + '<div style="min-width:0"><div class="t">' + g.t + '</div><div class="s trunc">' + g.s + '</div></div><div class="cnt">' + g.n + ic('chev') + '</div></div>').join('') +
   '<div class="tip" id="tip"><span>ดูเพื่อนทั้งหมดได้ที่แท็บแชท ›</span><button class="ib" id="tipx" aria-label="ปิด" style="color:#fff">' + ic('x') + '</button></div>' +
   '<div class="sec"><b>บริการ</b><a>ดูทั้งหมด</a></div>' +
   '<div class="svc">' + SERVICES.map(v => '<div><i>' + v[1] + '</i>' + v[0] + '</div>').join('') + '</div>' +
   '<div class="promo"><div class="l">แบ่งจ่ายค่าของขวัญ</div><div class="r"></div></div>';
  $('gear').onclick = () => $('menu').hidden = !$('menu').hidden;
  $('lo').onclick = doLogout;
  $('tipx').onclick = () => $('tip').remove();
}
function renderChats(){
  $('s-chat').innerHTML =
   '<div class="top"><div style="display:flex;gap:12px;align-items:center"><button class="pill">แชท ▾</button><b style="font-size:1.2rem">เพื่อน</b></div>' +
   '<div style="display:flex;gap:18px"><button class="ib" aria-label="อัลบั้ม">' + ic('image') + '<i class="dot" style="background:#2bb673"></i></button>' +
   '<button class="ib" aria-label="ปฏิทิน">' + ic('calendar') + '</button><button class="ib" aria-label="แชทใหม่">' + ic('plus') + '</button></div></div>' +
   '<div class="search">' + ic('search') + '<span>ค้นหา</span>' + ic('scan') + '</div>' +
   '<div class="ad" id="ad"><div><b>โปรโมชันสำหรับสมาชิก!!</b><p>ดูรายละเอียด ›</p></div><div class="adimg"></div><button class="ib adx" id="adx" aria-label="ปิดโฆษณา">' + ic('x') + '</button></div>' +
   CHATS.map(c => '<div class="chat">' + ava(c.n) + '<div style="min-width:0"><div class="n"><span class="trunc">' + esc(c.n) + '</span>' + (c.mute ? ic('mute') : '') +
     '</div><div class="s trunc">' + esc(c.m) + '</div></div><div class="meta"><span>' + c.t + '</span>' +
     (c.u ? '<span class="badge">' + c.u + '</span>' : c.pin ? ic('pin') : '') + '</div></div>').join('');
}
function renderBubble(){
  $('s-chat').insertAdjacentHTML('beforeend', '<div class="bubble" id="bub"><b>แท็บแชทเปลี่ยนลุคใหม่แล้ว!</b><br><u>ดูว่ามีอะไรเปลี่ยน ›</u><button id="later">ภายหลัง</button></div>');
  $('later').onclick = () => $('bub').remove();
  $('adx').onclick = () => $('ad').remove();
}
function renderTabs(){
  const total = CHATS.reduce((a, c) => a + c.u, 0);
  $('tabs').innerHTML = TABS.map(t => '<button class="tab" data-k="' + t[0] + '">' + ic(t[0]) + t[1] +
    (t[0] === 'chat' ? '<span class="nb">' + (total > 99 ? '99+' : total) + '</span>' : t[0] === 'home' ? '' : '<i class="dot"></i>') + '</button>').join('');
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => go(b.dataset.k));
}
function go(k){
  $('s-home').hidden = k !== 'home'; $('s-chat').hidden = k !== 'chat'; $('s-soon').hidden = ['home','chat'].includes(k);
  if (!['home','chat'].includes(k)) $('soon').textContent = TABS.find(t => t[0] === k)[1] + ' (เร็วๆ นี้)';
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.k === k));
}
function showApp(u){
  $('site').hidden = true; $('top').hidden = true; $('app').hidden = false;
  renderHome(u); renderChats(); renderBubble(); renderTabs(); go('home');
}
function showSite(){ $('site').hidden = false; $('top').hidden = false; $('app').hidden = true; window.scrollTo(0, 0); }
function doLogout(){ call('logout', token).catch(() => {}); token = null; store.del('tk'); showSite(); }
$('loginBtn').onclick = () => { setMode('login'); $('dlg').showModal(); };
$('cls').onclick = () => $('dlg').close();
$('swt').onclick = () => setMode(mode === 'login' ? 'reg' : 'login');
$('af').onsubmit = async ev => {
  ev.preventDefault(); $('aerr').textContent = '...';
  try {
    const r = mode === 'login' ? await call('login', $('ae').value, $('ap').value)
                               : await call('register', $('an').value, $('ae').value, $('ap').value);
    token = r.token; store.set('tk', token); $('af').reset(); $('dlg').close(); showApp(r);
  } catch (err) { $('aerr').textContent = String(err.message || err).replace(/^Error:\s*/, ''); }
};
$('logoutBtn').onclick = doLogout;
if (token) call('getMe', token).then(u => u ? showApp(u) : (store.del('tk'), token = null)).catch(() => {});
apply();
</script>
</body>
